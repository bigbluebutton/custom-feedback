name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, without the leading v (e.g. 1.15.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semver version (e.g. 1.15.0)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check tag does not exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

      - name: Check CHANGELOG has an entry
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! grep -qxF "### v$VERSION" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '### v$VERSION' section"
            exit 1
          fi

      - name: Bump package versions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for dir in frontend backend; do
            (cd "$dir" && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          done

      - name: Commit, tag and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json \
                  backend/package.json backend/package-lock.json
          git commit -m "$VERSION"
          git tag "v$VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v$VERSION"
